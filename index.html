<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mohammed Amine TALHI — Supply Chain Engineer</title>
    <meta
      name="description"
      content="Supply Chain Engineer (EMINES – UM6P). Planning, scheduling and industrial flow optimization — from shop-floor data to decision."
    />
    <meta property="og:title" content="Mohammed Amine TALHI — Supply Chain Engineer" />
    <meta
      property="og:description"
      content="Planning, scheduling and industrial flow optimization — from shop-floor data to decision."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/profile.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the visitor's saved theme before the first paint. The admin default
         lives in the config bundle, which main.tsx applies once it has loaded. -->
    <script>
      try {
        var t = localStorage.getItem('portfolio.theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink-950 text-zinc-200 antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
