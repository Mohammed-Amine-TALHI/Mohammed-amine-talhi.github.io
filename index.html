    <!-- Apply the visitor's saved theme before the first paint. The admin default
         lives in the config bundle, which main.tsx applies once it has loaded. -->
    <script>
      try {
        var t = localStorage.getItem('portfolio.theme') || document.documentElement.dataset.default;
        if (t === 'auto') {
          // rough day/night guess for the very first paint; the app refines it
          // to the real sunrise and sunset a moment later
          var h = new Date().getHours();
          t = h >= 7 && h < 19 ? 'light' : 'dark';
        }
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- Instant shell: painted from this file alone, before any CSS or JS has
         arrived, so a slow connection shows the name instead of a blank page.
         React replaces it as soon as the app mounts. Fonts are bundled with the
         site (see main.tsx): no third-party request can hold the page up. -->
    <style>
      html { background: #ffffff; color: #14203f; }
      html[data-theme='dark'] { background: #0a0a0f; color: #e4e4ec; }
      #shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #shell h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.75rem); font-weight: 800; letter-spacing: -0.03em; }
      #shell p { margin: 10px 0 22px; font-size: 0.95rem; opacity: 0.6; }
      #shell i { display: block; width: 120px; height: 3px; margin: 0 auto; border-radius: 3px; overflow: hidden;
        background: rgba(128, 128, 128, 0.22); position: relative; }
      #shell i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px;
        background: #e8412a; animation: shell-slide 1.1s ease-in-out infinite; }
      @keyframes shell-slide { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
    </style>
  </head>
  <body class="bg-ink-950 text-zinc-200 antialiased transition-colors duration-300">
    <div id="root">
      <div id="shell">
        <div>
